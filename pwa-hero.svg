<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Historyczna wyprawa — mapa Trójmiasta</title>
<desc id="desc">Ilustracja mapy Trójmiasta z datami historycznymi i gęstą kolorową trasą.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07131d"/><stop offset=".55" stop-color="#123c46"/><stop offset="1" stop-color="#07131d"/></linearGradient>
